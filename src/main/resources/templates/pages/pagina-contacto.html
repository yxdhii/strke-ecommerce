<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto - STRKE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="d-flex flex-column min-vh-100">
  <div th:replace="fragments/header :: header"></div>

  <div class="page-header text-center">
    <span class="page-header-tag">Estamos aquí para ti</span>
    <h1 class="page-header-titulo">CONTÁCT<span>ANOS</span></h1>
  </div>

  <main class="flex-grow-1 bg-gris py-5">
    <div class="container">
      <div class="row g-5">
        <div class="col-md-4">
          <h4 style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:28px;">INFO DE <span style="color:#671988;">CONTACTO</span></h4>
          <div class="d-flex flex-column gap-4">
            <div>
              <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#999;margin-bottom:4px;">Dirección</div>
              <div style="font-size:14px;">Lima, Perú</div>
            </div>
            <div>
              <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#999;margin-bottom:4px;">Email</div>
              <div style="font-size:14px;">hola@strke.pe</div>
            </div>
            <div>
              <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#999;margin-bottom:4px;">WhatsApp</div>
              <div style="font-size:14px;">+51 999 000 000</div>
            </div>
            <div>
              <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#999;margin-bottom:4px;">Horario</div>
              <div style="font-size:14px;">Lun–Sáb: 9am – 7pm</div>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-card">
            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="nombre" class="form-label">Nombre completo</label>
                  <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                </div>
                <div class="col-md-6">
                  <label for="correo" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="correo" placeholder="tuemail@ejemplo.com" required>
                </div>
                <div class="col-12">
                  <label for="asunto" class="form-label">Asunto</label>
                  <input type="text" class="form-control" id="asunto" placeholder="¿En qué te podemos ayudar?">
                </div>
                <div class="col-12">
                  <label for="mensaje" class="form-label">Mensaje</label>
                  <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary px-5 py-2">Enviar Mensaje</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="fragments/footer :: footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
