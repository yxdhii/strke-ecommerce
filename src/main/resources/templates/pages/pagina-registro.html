<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - STRKE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-gris">
  <div th:replace="fragments/header :: header"></div>
  <main class="flex-fill d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="form-card">
            <div class="text-center mb-4">
              <div class="form-titulo">CREAR <span>CUENTA</span></div>
              <p class="form-subtitulo">Únete a la comunidad STRKE</p>
            </div>
            <form>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
              </div>
              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="tuemail@ejemplo.com" required>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Crear Cuenta</button>
              <div class="text-center mt-3">
                <a th:href="@{/pagina-login}" style="font-size:13px;color:#8953b8;text-decoration:none;">¿Ya tienes cuenta? Inicia sesión</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="mt-auto" th:replace="fragments/footer :: footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
